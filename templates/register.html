<html>
  <head>
    <link rel="stylesheet" href="../static//css/register.css" />
  </head>
  <body>
    <div class="parent">
      <div class="child">
        <form action="/" method="post">
          <h2>Регистрация</h2>

          <div class="input-group">
            <label for="name">Логин</label><br />
            <input
              type="text"
              id="login"
              name="login"
              placeholder="Ваш логин"
              required
            /><br />
          </div>

          <div class="input-group">
            <label for="age">Пароль</label><br />
            <input
              type="number"
              id="password"
              name="password1"
              placeholder="Пароль"
              required
            /><br />
          </div>
          <div class="input-group">
            <label for="age">Повторите пароль</label><br />
            <input
              type="number"
              id="password"
              name="password2"
              placeholder="Пароль"
              required
            /><br />
          </div>

          <div class="input-group">
            <label for="name">Имя</label><br />
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Имя персонажа"
              required
            /><br />
          </div>

          <div class="input-group">
            <label for="age">Возраст</label><br />
            <input
              type="number"
              id="age"
              name="age"
              min="18"
              max="40"
              placeholder="Возраст персонажа"
              required
            /><br />
          </div>

          <button type="submit">Играть</button><br />

          <div class="auth-link" style="margin-top: 15px; text-align: center">
            <span>Есть аккаунт?</span>
            <a href="/auth">Войти</a>
          </div>
        </form>
      </div>
    </div>

    
  </body>
</html>
